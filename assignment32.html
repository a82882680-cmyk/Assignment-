<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive, perfectly centred login form using CSS Flexbox.">
  <title>Login Form | Anshika</title>

  <style>
    :root {
      --primary: #5b4bdb;
      --secondary: #3f31b0;
      --background: #eef0f8;
      --white: #ffffff;
      --text: #333333;
      --border: #cccccc;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: system-ui, sans-serif;
    }

    /* ---------- LOGIN FORM ---------- */
    .login {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .login__header {
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .login__header h1 {
      margin: 0 0 0.5rem;
      color: var(--primary);
      font-size: 1.8rem;
    }

    .login__header p {
      margin: 0;
      color: #666666;
      font-size: 0.95rem;
    }

    /* ---------- INPUT FIELDS ---------- */
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      color: var(--text);
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
    }

    .field input:focus {
      outline: 3px solid #c3b5ff;
      border-color: var(--primary);
    }

    /* ---------- REMEMBER ME & FORGOT PASSWORD ---------- */
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .row a {
      color: var(--primary);
      text-decoration: none;
    }

    .row a:hover {
      text-decoration: underline;
    }

    /* ---------- LOGIN BUTTON ---------- */
    .login__button {
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }

    .login__button:hover {
      background: var(--secondary);
    }

    .login__footer {
      margin: 0;
      text-align: center;
      color: #666666;
      font-size: 0.9rem;
    }

    .login__footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .login__footer a:hover {
      text-decoration: underline;
    }

    /* ---------- RESPONSIVE DESIGN ---------- */
    @media (max-width: 400px) {
      .login {
        padding: 1.5rem;
      }

      .login__header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <main>
    <form class="login" action="#" method="post">

      <header class="login__header">
        <h1>Welcome Back!</h1>
        <p>Login to your account</p>
      </header>

      <label class="field" for="email">
        Email Address
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required>
      </label>

      <label class="field" for="password">
        Password
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          minlength="8"
          autocomplete="current-password"
          required>
      </label>

      <div class="row">
        <label>
          <input type="checkbox" name="remember">
          Remember me
        </label>

        <a href="#forgot-password">Forgot password?</a>
      </div>

      <button class="login__button" type="submit">
        Log In
      </button>

      <p class="login__footer">
        New here? <a href="#signup">Create an account</a>
      </p>

    </form>
  </main>

</body>

</html>
