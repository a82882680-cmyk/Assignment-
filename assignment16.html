<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student registration form of Anshika Patel, BCA AI, Invertis University.">
  <title>Anshika's Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 700px; margin: auto; padding: 16px; color: #222; }
    h1 { background: #1f3a5f; color: #fff; padding: 14px; border-radius: 6px; }
    fieldset { margin: 18px 0; padding: 12px 16px; border: 2px solid #1f3a5f; border-radius: 6px; }
    legend { font-weight: bold; color: #1f3a5f; }
    label { display: block; margin-top: 10px; }
    input[type="text"], input[type="email"], input[type="password"], input[type="number"],
    input[type="date"], select, textarea { width: 100%; padding: 6px; box-sizing: border-box; }
    .inline label { display: inline-block; margin-right: 14px; }
    button { padding: 8px 18px; margin-right: 8px; cursor: pointer; }
  </style>
</head>

<body>
  <h1>Student Registration Form</h1>
  <p>Please fill in all details marked with *.</p>

  <form action="#" method="post">

    <fieldset>
      <legend>Personal Details</legend>

      <label for="fullname">Full name *</label>
      <input type="text" id="fullname" name="fullname" value="Anshika Patel" required>

      <label for="dob">Date of birth *</label>
      <input type="date" id="dob" name="dob" value="2007-01-01" required>

      <div class="inline">
        <p>Gender:</p>
        <label><input type="radio" name="gender" value="female" checked> Female</label>
        <label><input type="radio" name="gender" value="male"> Male</label>
        <label><input type="radio" name="gender" value="other"> Prefer not to say</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Contact Details</legend>

      <label for="email">Email *</label>
      <input type="email" id="email" name="email" value="a82882680@gmail.com" required>

      <label for="city">City *</label>
      <input type="text" id="city" name="city" value="Bareilly" required>
    </fieldset>

    <fieldset>
      <legend>Academic Details</legend>

      <label for="university">University</label>
      <input type="text" id="university" name="university" value="Invertis University" readonly>

      <label for="course">Course *</label>
      <select id="course" name="course" required>
        <option value="">-- Select course --</option>
        <option value="bca-ai" selected>BCA (Artificial Intelligence)</option>
        <option value="bca">BCA</option>
        <option value="btech-cse">B.Tech CSE</option>
        <option value="bsc-it">B.Sc IT</option>
      </select>

      <label for="year">Admission year</label>
      <input type="number" id="year" name="year" value="2026" min="2020" max="2030">

      <p>Subjects this year:</p>
      <div class="inline">
        <label><input type="checkbox" name="subjects" value="java" checked> Java</label>
        <label><input type="checkbox" name="subjects" value="html" checked> HTML</label>
        <label><input type="checkbox" name="subjects" value="css" checked> CSS</label>
        <label><input type="checkbox" name="subjects" value="js" checked> JavaScript</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Account and About</legend>

      <label for="password">Create password * (minimum 8 characters)</label>
      <input type="password" id="password" name="password" value="Student@2026" minlength="8" required>

      <label for="about">A few words about yourself</label>
      <textarea id="about" name="about" rows="5">I am a first-year BCA Artificial Intelligence student at Invertis University. I am curious about how intelligent systems work, how people think, and how good design can make complex ideas easy to use. I have worked on a cybersecurity project for Smart India Hackathon and I enjoy building simple web pages. My interests are AI, cybersecurity and user-centred design.</textarea>

      <label><input type="checkbox" name="terms" checked required> I confirm that the information given is correct *</label>
    </fieldset>

    <button type="submit">Register</button>
    <button type="reset">Clear</button>
  </form>
</body>

</html>
